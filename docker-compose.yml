# Local development infrastructure. Application services run on the host (pnpm dev);
# see infrastructure/docker for production images.
name: devsync

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension available (semantic search, Phase 5).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync
      POSTGRES_DB: devsync
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devsync -d devsync']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes public images. Build it once from source with
    #   docker build -t devsync/minio:RELEASE.2025-09-07T16-13-09Z infrastructure/docker/minio
    # (or retag a cached quay.io/minio/minio image). The bucket is created by the app (S3 API).
    image: ${MINIO_IMAGE:-devsync/minio:RELEASE.2025-09-07T16-13-09Z}
    build:
      context: ./infrastructure/docker/minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: devsync
      MINIO_ROOT_PASSWORD: devsync-secret
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Captures outgoing emails (invitations, password reset) in development.
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
