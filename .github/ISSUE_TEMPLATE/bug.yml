name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        [Web app, Realtime, Bridge (devsync CLI), Claude Code plugin / MCP, Worker, Deployment]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Bridge/plugin version, self-hosted or not. Remove any secret from logs.
