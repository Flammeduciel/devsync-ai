name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devsync" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://devsync:devsync@localhost:5432/devsync_test
      DATABASE_URL_TEST: postgresql://devsync:devsync@localhost:5432/devsync_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @devsync/database db:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @devsync/realtime build
