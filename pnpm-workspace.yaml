packages:
  - 'apps/*'
  - 'packages/*'

autoInstallPeers: true
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - onnxruntime-node
  - protobufjs

# Also install Linux native binaries (sharp, onnxruntime) so services can run in Linux containers
# from a macOS checkout (e.g. the embedding worker on Intel Macs, which onnxruntime no longer supports).
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [glibc]
